# lefthook.yml — capa 1 (formato + estilo) y specs
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.java"
      run: ./mvnw -q spotless:apply
      stage_fixed: true        # el formato es determinista: se corrige y se vuelve a añadir
    style:
      glob: "*.java"
      run: ./mvnw -q checkstyle:check
      fail_text: "Checkstyle: revisa las violaciones de arriba (archivo:línea y qué hacer)"
    specs:
      glob: "openspec/**"
      run: openspec validate --all --strict --no-interactive
    secrets:
      # Capa 2 (lab S13): Gitleaks sobre lo que se va a commitear. No se salta con --no-verify (hook del agente).
      run: gitleaks git --pre-commit --staged --config .gitleaks.toml --redact --no-banner --log-level warn
      fail_text: "Gitleaks: secreto en el commit. Sácalo a una variable de entorno o genéralo en el test; si ya se publicó, rótalo."
