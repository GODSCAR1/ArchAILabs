spring.application.name=master-acdc
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Red de seguridad contra N+1 (ADR listado-de-pedidos): no es la solucion de ningun listado.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.data.mongodb.auto-index-creation=false

# Lab S11: cache multinivel (ADR 0010)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# MongoDB: los ids del catálogo son UUID (ADR 0009); sin esto el driver no los codifica
spring.mongodb.representation.uuid=standard

# Lab S12: autenticación (ADR 0011)
shop.jwt.private-key=${SHOP_JWT_PRIVATE_KEY}
shop.jwt.issuer=https://api.master-acdc.dev
shop.jwt.audience=master-acdc-api
shop.ops.user=${SHOP_OPS_USER}
shop.ops.password-hash=${SHOP_OPS_PASSWORD_HASH}
