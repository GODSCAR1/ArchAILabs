rules:
  - id: shop-no-weak-password-reset-random
    languages: [java]
    severity: ERROR
    message: Usa SecureRandom para generar secretos.
    patterns:
      - pattern-either:
          - pattern: new java.util.Random(...)
          - pattern: java.util.concurrent.ThreadLocalRandom.current()
          - pattern: Math.random()
          - pattern: java.util.random.RandomGenerator.getDefault()
          - pattern: java.util.random.RandomGenerator.of(...)
      - pattern-either:
          - pattern-inside: |
              class $CLASS implements PasswordResetSecrets { ... }
          - patterns:
              - pattern-inside: |
                  class $CLASS { ... }
              - metavariable-regex:
                  metavariable: $CLASS
                  regex: '(?i).*(token|secret|password|reset|code|otp|verification|nonce|salt).*'
          - patterns:
              - pattern-inside: |
                  $RETURN $METHOD(...) { ... }
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: '(?i).*(token|secret|password|reset|code|otp|verification|nonce|salt).*'
          - patterns:
              - pattern-inside: $TYPE $NAME = <... ... ...>;
              - metavariable-regex:
                  metavariable: $NAME
                  regex: '(?i).*(token|secret|password|reset|code|otp|verification|nonce|salt).*'
          - patterns:
              - pattern-inside: $NAME = <... ... ...>;
              - metavariable-regex:
                  metavariable: $NAME
                  regex: '(?i).*(token|secret|password|reset|code|otp|verification|nonce|salt).*'
