rules:
  - id: shop-no-customer-id-param
    languages: [java]
    severity: ERROR
    message: El cliente debe derivarse de la cuenta autenticada, no de la petición.
    paths:
      include:
        - '**/adapters/in/web/**'
        - '**/shop-no-customer-id-param.java'
    pattern-either:
      - pattern: '$RET $METHOD(..., @RequestParam(...) $TYPE customerId, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestParam $TYPE customerId, ...) { ... }'
      - pattern: '$RET $METHOD(..., @PathVariable(...) $TYPE customerId, ...) { ... }'
      - pattern: '$RET $METHOD(..., @PathVariable $TYPE customerId, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestHeader(...) $TYPE customerId, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestHeader $TYPE customerId, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestBody $TYPE customerId, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestParam("customerId") $TYPE $PARAM, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestParam(value = "customerId", ...) $TYPE $PARAM, ...) { ... }'
      - pattern: '$RET $METHOD(..., @PathVariable("customerId") $TYPE $PARAM, ...) { ... }'
      - pattern: '$RET $METHOD(..., @PathVariable(value = "customerId", ...) $TYPE $PARAM, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestHeader("customerId") $TYPE $PARAM, ...) { ... }'
      - pattern: '$RET $METHOD(..., @RequestHeader(value = "customerId", ...) $TYPE $PARAM, ...) { ... }'
      - patterns:
          - pattern: $TYPE customerId;
          - pattern-inside: class $DTO { ... }
          - metavariable-regex:
              metavariable: $DTO
              regex: '.*(Request|Body|Input|Command|Dto|DTO).*'
      - patterns:
          - pattern: record $DTO(..., $TYPE customerId, ...) { ... }
          - metavariable-regex:
              metavariable: $DTO
              regex: '.*(Request|Body|Input|Command|Dto|DTO).*'
